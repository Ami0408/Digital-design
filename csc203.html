<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logic Design CBT (Source-Specific)</title>
    <style>
        :root {
            --primary: #2b3a42;
            --secondary: #3f51b5;
            --accent: #ff4081;
            --light-bg: #f0f2f5;
            --correct: #00c853;
            --wrong: #d50000;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        
        .timer-box {
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .quiz-body {
            padding: 40px;
            flex-grow: 1;
        }

        .question-card {
            display: none;
        }
        
        .question-card.active {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .q-text {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.5;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background-color: #f8f9ff;
        }

        .option-btn.selected {
            border-color: var(--secondary);
            background-color: #e8eaf6;
            font-weight: 600;
        }
        
        .option-btn.selected::after {
            content: '✓';
            position: absolute;
            right: 20px;
            color: var(--secondary);
        }

        .footer-controls {
            padding: 20px 40px;
            border-top: 1px solid #eee;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-prev { background: #cfd8dc; color: #455a64; }
        .btn-next { background: var(--secondary); color: white; }
        .btn-finish { background: var(--correct); color: white; display: none; }
        
        .btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Palette Styles */
        .palette-trigger {
            text-align: center;
            padding: 10px;
            color: var(--secondary);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .palette-grid {
            display: none; /* Hidden by default */
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 8px;
            padding: 20px 40px;
            background: #f1f1f1;
            border-top: 1px solid #ddd;
            max-height: 200px;
            overflow-y: auto;
        }

        .p-node {
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .p-node.active { border: 2px solid var(--secondary); font-weight: bold; }
        .p-node.answered { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Results Screen */
        #results-view {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .score-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--secondary);
            margin: 20px 0;
        }

        .review-list {
            text-align: left;
            margin-top: 40px;
        }

        .review-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .review-q { font-weight: bold; margin-bottom: 8px; color: #444; }
        .review-ans { font-size: 0.95rem; }
        .ans-corr { color: var(--correct); font-weight: bold; }
        .ans-wrong { color: var(--wrong); font-weight: bold; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-view">
        <header>
            <h1>Digital Logic Exam</h1>
            <div class="timer-box">Q: <span id="q-curr">1</span> / 100</div>
        </header>

        <div class="quiz-body" id="quiz-body">
            </div>

        <div class="palette-trigger" onclick="togglePalette()">Toggle Question Map</div>
        <div class="palette-grid" id="palette-box"></div>

        <div class="footer-controls">
            <button class="nav-btn btn-prev" id="btn-prev" onclick="nav(-1)" disabled>Previous</button>
            <button class="nav-btn btn-next" id="btn-next" onclick="nav(1)">Next</button>
            <button class="nav-btn btn-finish" id="btn-finish" onclick="finishTest()">Submit Exam</button>
        </div>
    </div>

    <div id="results-view">
        <h1>Examination Completed</h1>
        <div class="score-display" id="final-score">0%</div>
        <p>You scored <span id="raw-score">0</span> out of 100</p>
        <button class="nav-btn btn-next" onclick="location.reload()">Retake Exam</button>
        <div class="review-list" id="review-container"></div>
    </div>
</div>

<script>
    /* Source Key: 
       [DF] = Dr. Festus CSC 203 Val. gift.pdf
       [SC] = Schaum's Outline of Digital Principles.pdf
       [DL] = Digital Logic Design.pdf
    */
    const db = [
        // --- SECTION 1: INTRODUCTION & INTEGRATED CIRCUITS (Based on Dr. Festus & Digital Logic Design) ---
        {q: "Digital Logic is rooted in which code system?", o: ["Decimal", "Binary", "Octal", "Hexadecimal"], a: 1, src: "[DL] Intro"},
        {q: "Which integration level contains less than 10 independent gates?", o: ["MSI", "LSI", "SSI", "VLSI"], a: 2, src: "[DF] IC Classification"},
        {q: "MSI (Medium Scale Integration) typically contains how many gates?", o: ["10 to 200", "200 to 1000", "< 10", "> 1000"], a: 0, src: "[DF] IC Classification"},
        {q: "Which logic family uses Bipolar Transistors?", o: ["CMOS", "NMOS", "TTL", "FET"], a: 2, src: "[DF] Classification by Technology"},
        {q: "ECL stands for:", o: ["Emitter-Coupled Logic", "Energy-Coupled Logic", "Electric-Circuit Logic", "Emitter-Circuit Loop"], a: 0, src: "[DF] Classification by Technology"},
        {q: "Which logic family is known for low power consumption?", o: ["TTL", "ECL", "RTL", "CMOS"], a: 3, src: "[DF] Classification by Technology"},
        {q: "A digital computer stores data in terms of:", o: ["Voltage waves", "Discrete steps (Digits)", "Analog signals", "Frequency"], a: 1, src: "[DL] Intro"},
        {q: "MOS stands for:", o: ["Metal-Oxide Semiconductor", "Metal-Oxygen Silicon", "Memory-Operating System", "Main-Operating Source"], a: 0, src: "[DF] Technology"},
        {q: "VLSI stands for:", o: ["Very Low Scale Integration", "Very Large Scale Integration", "Variable Logic Scale Integration", "Vertical Level Silicon Integration"], a: 1, src: "[DF] IC Classification"},
        {q: "Which device is mentioned as a Digital Subsystem (200-few thousand gates)?", o: ["Logic Gate", "Processor", "Flip-Flop", "Decoder"], a: 1, src: "[DF] IC Classification"},

        // --- SECTION 2: NUMBER SYSTEMS - BINARY/DECIMAL (Based on Schaum's & Dr. Festus) ---
        {q: "The radix of the binary number system is:", o: ["10", "8", "2", "1"], a: 2, src: "[SC] Number Systems"},
        {q: "Decimal equivalent of binary 1101 is:", o: ["11", "12", "13", "14"], a: 2, src: "[SC] Conversions"},
        {q: "Binary equivalent of decimal 9 is:", o: ["1000", "1001", "1010", "1100"], a: 1, src: "[SC] Conversions"},
        {q: "In binary, 1 + 1 equals:", o: ["2", "10", "11", "1"], a: 1, src: "[SC] Binary Arithmetic"},
        {q: "What is the weight of the MSB in the binary number 1000?", o: ["4", "8", "16", "2"], a: 1, src: "[SC] Weights"},
        {q: "Binary 1010 + 0101 equals:", o: ["1111", "10000", "1101", "1011"], a: 0, src: "[SC] Binary Arithmetic"},
        {q: "The value of 2^0 is:", o: ["0", "1", "2", "Undefined"], a: 1, src: "[SC] Powers"},
        {q: "Convert decimal 15 to binary:", o: ["1110", "1111", "1011", "1101"], a: 1, src: "[SC] Conversions"},
        {q: "Which digit represents the LSB in 10110?", o: ["Leftmost 1", "Rightmost 0", "Middle 1", "Rightmost 1"], a: 1, src: "[SC] Terms"},
        {q: "How many bits are in a Nibble?", o: ["8", "16", "4", "2"], a: 2, src: "[DF] Terms"},
        {q: "How many bits are in a Byte?", o: ["4", "8", "16", "32"], a: 1, src: "[DF] Terms"},
        {q: "The decimal number 25 is written in binary as:", o: ["11001", "10011", "11100", "10101"], a: 0, src: "[SC] Conversions"},
        {q: "Binary 111 represents decimal:", o: ["6", "7", "8", "9"], a: 1, src: "[SC] Conversions"},
        {q: "The largest decimal number that can be represented by 3 bits is:", o: ["8", "7", "9", "6"], a: 1, src: "[SC] Binary Limits"},
        {q: "Binary multiplication 10 * 10 yields:", o: ["20", "100", "110", "101"], a: 1, src: "[SC] Arithmetic"},

        // --- SECTION 3: OCTAL & HEXADECIMAL (Based on Schaum's) ---
        {q: "The base of the Octal system is:", o: ["8", "10", "16", "2"], a: 0, src: "[SC] Octal"},
        {q: "The base of the Hexadecimal system is:", o: ["8", "10", "16", "6"], a: 2, src: "[SC] Hex"},
        {q: "Octal digit 7 in binary is:", o: ["101", "110", "111", "100"], a: 2, src: "[SC] Octal-Binary"},
        {q: "Hexadecimal digit A corresponds to decimal:", o: ["9", "10", "11", "12"], a: 1, src: "[SC] Hex"},
        {q: "Hexadecimal digit F corresponds to decimal:", o: ["14", "15", "16", "13"], a: 1, src: "[SC] Hex"},
        {q: "Binary 1010 in Hexadecimal is:", o: ["9", "A", "B", "C"], a: 1, src: "[SC] Hex-Binary"},
        {q: "Binary 1111 in Hexadecimal is:", o: ["E", "F", "10", "15"], a: 1, src: "[SC] Hex-Binary"},
        {q: "Convert Octal 10 to Decimal:", o: ["10", "8", "16", "12"], a: 1, src: "[SC] Octal-Decimal"},
        {q: "Convert Hex 10 to Decimal:", o: ["10", "16", "8", "20"], a: 1, src: "[SC] Hex-Decimal"},
        {q: "The digits used in Octal are:", o: ["0-9", "0-7", "0-8", "0-F"], a: 1, src: "[SC] Octal"},
        {q: "The digits used in Hexadecimal are:", o: ["0-9", "0-9 & A-F", "0-7", "1-10"], a: 1, src: "[SC] Hex"},
        {q: "Convert Hex 2C to binary:", o: ["0010 1100", "0010 1010", "1100 0010", "0010 1110"], a: 0, src: "[SC] Hex-Binary"},
        {q: "Which system is often used to shorten long binary strings?", o: ["Decimal", "Hexadecimal", "Analog", "Logarithmic"], a: 1, src: "[SC] Applications"},
        {q: "Octal 77 + 1 equals (in Octal):", o: ["78", "80", "100", "10"], a: 2, src: "[SC] Octal Math"},
        {q: "Hexadecimal 9 + 1 equals (in Hex):", o: ["10", "A", "B", "C"], a: 1, src: "[SC] Hex Math"},

        // --- SECTION 4: CODES - BCD, GRAY, ASCII (Based on Dr. Festus & Schaum's) ---
        {q: "BCD stands for:", o: ["Binary Coded Decimal", "Bit Coded Decimal", "Byte Coded Digit", "Binary Calculated Digit"], a: 0, src: "[DF/SC] Codes"},
        {q: "In BCD, decimal 5 is represented as:", o: ["0101", "101", "0000 0101", "1111"], a: 0, src: "[SC] BCD"},
        {q: "Does BCD use the codes 1010 through 1111?", o: ["Yes", "No (Forbidden codes)", "Sometimes", "Only for signs"], a: 1, src: "[SC] BCD"},
        {q: "Gray Code is also known as:", o: ["Reflected Code", "Weighted Code", "Alphanumeric Code", "BCD"], a: 0, src: "[SC] Gray Code"},
        {q: "The key feature of Gray Code is that between successive numbers:", o: ["Only one bit changes", "Two bits change", "All bits change", "No bits change"], a: 0, src: "[SC] Gray Code"},
        {q: "ASCII is a ___-bit code.", o: ["4", "7 (or 8)", "16", "32"], a: 1, src: "[SC] ASCII"},
        {q: "Parity bits are used for:", o: ["Error Correction", "Error Detection", "Encryption", "Data Compression"], a: 1, src: "[SC] Parity"},
        {q: "Excess-3 code for decimal 0 is:", o: ["0000", "0011", "0100", "1100"], a: 1, src: "[SC] Excess-3"},
        {q: "How many distinct characters can standard 7-bit ASCII represent?", o: ["64", "128", "256", "512"], a: 1, src: "[SC] ASCII"},
        {q: "Which code is non-weighted?", o: ["BCD", "Binary", "Gray Code", "Octal"], a: 2, src: "[SC] Codes"},

        // --- SECTION 5: LOGIC GATES (Based on Dr. Festus & Schaum's) ---
        {q: "The AND gate performs logical:", o: ["Addition", "Multiplication", "Inversion", "Division"], a: 1, src: "[DF] Gates"},
        {q: "The OR gate performs logical:", o: ["Addition", "Multiplication", "Subtraction", "Equality"], a: 0, src: "[DF] Gates"},
        {q: "Which gate is called an Inverter?", o: ["AND", "OR", "NOT", "NAND"], a: 2, src: "[DF] Gates"},
        {q: "Output is HIGH only if ALL inputs are HIGH. This describes:", o: ["OR", "NAND", "AND", "XOR"], a: 2, src: "[DF] Gates"},
        {q: "Output is LOW only if ALL inputs are LOW. This describes:", o: ["AND", "OR", "NOR", "XNOR"], a: 1, src: "[DF] Gates"},
        {q: "Which gates are known as Universal Gates?", o: ["AND & OR", "NAND & NOR", "XOR & XNOR", "NOT & Buffer"], a: 1, src: "[DF/SC] Universal"},
        {q: "The NAND gate is equivalent to:", o: ["AND followed by NOT", "OR followed by NOT", "NOT followed by AND", "XOR"], a: 0, src: "[SC] NAND"},
        {q: "The NOR gate is equivalent to:", o: ["AND followed by NOT", "OR followed by NOT", "NOT followed by OR", "XNOR"], a: 1, src: "[SC] NOR"},
        {q: "An XOR gate output is HIGH when inputs are:", o: ["The same", "Different", "Both High", "Both Low"], a: 1, src: "[SC] XOR"},
        {q: "An XNOR gate output is HIGH when inputs are:", o: ["The same", "Different", "Both High only", "One Low One High"], a: 0, src: "[SC] XNOR"},
        {q: "The symbol for an AND gate is:", o: ["Triangle", "D-shape", "Curved shield", "Rectangle"], a: 1, src: "[DL] Symbols"},
        {q: "The symbol for an OR gate is:", o: ["D-shape", "Curved shield", "Triangle", "Circle"], a: 1, src: "[DL] Symbols"},
        {q: "The bubble at the output of a NAND gate indicates:", o: ["Amplification", "Inversion", "Ground", "Input"], a: 1, src: "[DL] Symbols"},
        {q: "How many rows are in the truth table for a 2-input gate?", o: ["2", "4", "8", "16"], a: 1, src: "[DF] Truth Tables"},
        {q: "How many rows are in the truth table for a 3-input gate?", o: ["4", "6", "8", "9"], a: 2, src: "[DF] Truth Tables"},
        {q: "If inputs A=1, B=0, the output of an AND gate is:", o: ["1", "0", "Undefined", "High Impedance"], a: 1, src: "[DF] Gates"},
        {q: "If inputs A=1, B=0, the output of an OR gate is:", o: ["1", "0", "Undefined", "High Impedance"], a: 0, src: "[DF] Gates"},
        {q: "The boolean expression Y = A.B represents:", o: ["OR", "AND", "NOT", "NOR"], a: 1, src: "[DF] Boolean"},
        {q: "The boolean expression Y = A+B represents:", o: ["OR", "AND", "NAND", "XOR"], a: 0, src: "[DF] Boolean"},
        {q: "The boolean expression Y = A' represents:", o: ["Buffer", "NOT", "AND", "OR"], a: 1, src: "[DF] Boolean"},
        {q: "For a NOR gate, if A=0 and B=0, Output is:", o: ["0", "1", "High Z", "Unknown"], a: 1, src: "[SC] NOR"},
        {q: "For a NAND gate, if A=1 and B=1, Output is:", o: ["0", "1", "High Z", "Unknown"], a: 0, src: "[SC] NAND"},
        {q: "Which gate is used to implement a Parity Checker?", o: ["AND", "OR", "XOR", "NAND"], a: 2, src: "[SC] XOR"},
        {q: "TTL voltage level for Logic 1 is typically:", o: ["12V", "5V", "1V", "24V"], a: 1, src: "[DF] TTL"},
        {q: "An open circuit in digital logic often acts as logic:", o: ["0", "1", "Oscillating", "Short"], a: 1, src: "[DL] Practical"},

        // --- SECTION 6: BOOLEAN ALGEBRA & SIMPLIFICATION (Based on Dr. Festus & Schaum's) ---
        {q: "A + 0 =", o: ["0", "1", "A", "A'"], a: 2, src: "[DF] Axioms"},
        {q: "A . 1 =", o: ["0", "1", "A", "A'"], a: 2, src: "[DF] Axioms"},
        {q: "A + A =", o: ["2A", "A", "1", "0"], a: 1, src: "[DF] Idempotent"},
        {q: "A . A =", o: ["A^2", "A", "1", "0"], a: 1, src: "[DF] Idempotent"},
        {q: "A + A' =", o: ["0", "1", "A", "Impossible"], a: 1, src: "[DF] Inverse"},
        {q: "A . A' =", o: ["0", "1", "A", "A'"], a: 0, src: "[DF] Inverse"},
        {q: "A + 1 =", o: ["A", "1", "0", "Undefined"], a: 1, src: "[DF] Annulment"},
        {q: "A . 0 =", o: ["A", "0", "1", "Undefined"], a: 1, src: "[DF] Annulment"},
        {q: "Commutative Law for addition:", o: ["A+B = B+A", "A+B = AB", "A(B+C) = AB+AC", "A+A=A"], a: 0, src: "[DF] Laws"},
        {q: "Associative Law for addition:", o: ["A+(B+C) = (A+B)+C", "A+B=B+A", "A(BC)=(AB)C", "A+AB=A"], a: 0, src: "[DF] Laws"},
        {q: "De Morgan's Theorem (A.B)' =", o: ["A' . B'", "A' + B'", "A + B", "A'B"], a: 1, src: "[DF] DeMorgan"},
        {q: "De Morgan's Theorem (A+B)' =", o: ["A' + B'", "A' . B'", "AB", "A + B'"], a: 1, src: "[DF] DeMorgan"},
        {q: "Involution Law (A')' =", o: ["A'", "A", "0", "1"], a: 1, src: "[DF] Laws"},
        {q: "Absorption Law A + AB =", o: ["B", "AB", "A", "1"], a: 2, src: "[DF] Simplification"},
        {q: "Simplification: A(A + B) =", o: ["B", "AB", "A", "A'"], a: 2, src: "[DF] Simplification"},
        {q: "SOP stands for:", o: ["Sum of Products", "Standard Output Protocol", "Sum of Primes", "Series of Pulses"], a: 0, src: "[SC] Forms"},
        {q: "POS stands for:", o: ["Product of Sums", "Power of Source", "Product of Series", "Point of Sums"], a: 0, src: "[SC] Forms"},
        {q: "A Minterm is associated with which logic?", o: ["OR", "AND", "NOT", "XOR"], a: 1, src: "[SC] Minterms"},
        {q: "A Maxterm is associated with which logic?", o: ["OR", "AND", "NOT", "XOR"], a: 0, src: "[SC] Maxterms"},
        {q: "In a Karnaugh Map, grouping 4 ones eliminates how many variables?", o: ["1", "2", "3", "4"], a: 1, src: "[DF] K-Map"},
        {q: "Karnaugh Maps are used for:", o: ["Circuit Fabrication", "Boolean Function Simplification", "Voltage Regulation", "Memory Storage"], a: 1, src: "[DF] K-Map"},
        {q: "Canonical form refers to:", o: ["Simplified form", "Standard form (Minterms/Maxterms)", "Gate schematic", "Truth Table"], a: 1, src: "[DF] Canonical"},
        {q: "A + A'B simplifies to:", o: ["A + B", "A' + B", "AB", "A + B'"], a: 0, src: "[SC] Simplification"},
        {q: "The complement of 0 is:", o: ["0", "1", "A", "Null"], a: 1, src: "[DF] Basic"},
        {q: "Example of a Combinational Circuit:", o: ["Flip-Flop", "Counter", "Adder", "Register"], a: 2, src: "[DF] Combinational"}
    ];

    let currentQ = 0;
    const userAnswers = new Array(db.length).fill(null);

    function init() {
        const body = document.getElementById('quiz-body');
        const palette = document.getElementById('palette-box');

        db.forEach((item, index) => {
            // Build Question Card
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `q-card-${index}`;

            let optsHtml = '<div class="options-list">';
            item.o.forEach((opt, oIdx) => {
                optsHtml += `<div class="option-btn" id="opt-${index}-${oIdx}" onclick="selectAns(${index}, ${oIdx})">${opt}</div>`;
            });
            optsHtml += '</div>';

            card.innerHTML = `<div class="q-text">${index + 1}. ${item.q}</div>${optsHtml}`;
            body.appendChild(card);

            // Build Palette Item
            const pNode = document.createElement('div');
            pNode.className = `p-node ${index === 0 ? 'active' : ''}`;
            pNode.id = `p-node-${index}`;
            pNode.innerText = index + 1;
            pNode.onclick = () => jumpTo(index);
            palette.appendChild(pNode);
        });
    }

    function selectAns(qIdx, oIdx) {
        userAnswers[qIdx] = oIdx;

        // UI Updates for Options
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`opt-${qIdx}-${i}`);
            btn.classList.remove('selected');
        }
        document.getElementById(`opt-${qIdx}-${oIdx}`).classList.add('selected');

        // UI Updates for Palette
        document.getElementById(`p-node-${qIdx}`).classList.add('answered');
    }

    function jumpTo(index) {
        document.getElementById(`q-card-${currentQ}`).classList.remove('active');
        document.getElementById(`p-node-${currentQ}`).classList.remove('active');

        currentQ = index;

        document.getElementById(`q-card-${currentQ}`).classList.add('active');
        document.getElementById(`p-node-${currentQ}`).classList.add('active');
        document.getElementById('q-curr').innerText = currentQ + 1;

        updateButtons();
    }

    function nav(direction) {
        const newIdx = currentQ + direction;
        if (newIdx >= 0 && newIdx < db.length) {
            jumpTo(newIdx);
        }
    }

    function updateButtons() {
        document.getElementById('btn-prev').disabled = (currentQ === 0);
        
        if (currentQ === db.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-finish').style.display = 'block';
        } else {
            document.getElementById('btn-next').style.display = 'block';
            document.getElementById('btn-finish').style.display = 'none';
        }
    }

    function togglePalette() {
        const p = document.getElementById('palette-box');
        p.style.display = (p.style.display === 'grid') ? 'none' : 'grid';
    }

    function finishTest() {
        if (!confirm("Are you sure you want to finish the exam?")) return;

        let score = 0;
        let html = '';

        db.forEach((q, i) => {
            const u = userAnswers[i];
            const isCorrect = (u === q.a);
            if (isCorrect) score++;

            const uText = (u !== null) ? q.o[u] : "Skipped";
            const cText = q.o[q.a];

            html += `
                <div class="review-item">
                    <div class="review-q">Q${i+1}: ${q.q} <span style="font-size:0.8em; color:#888;">${q.src}</span></div>
                    <div class="review-ans">
                        Your Answer: <span class="${isCorrect ? 'ans-corr' : 'ans-wrong'}">${uText}</span><br>
                        ${!isCorrect ? `Correct Answer: <span class="ans-corr">${cText}</span>` : ''}
                    </div>
                </div>
            `;
        });

        const percent = Math.round((score / db.length) * 100);

        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('results-view').style.display = 'block';
        document.getElementById('final-score').innerText = percent + "%";
        document.getElementById('raw-score').innerText = score;
        document.getElementById('review-container').innerHTML = html;
        
        window.scrollTo(0, 0);
    }

    // Start
    window.onload = init;
</script>

</body>
</html>
